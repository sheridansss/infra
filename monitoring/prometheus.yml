# Конфиг Prometheus: скрейп всех компонентов стека изнутри docker-сети.
# RabbitMQ и SeaweedFS отдают метрики нативно, остальным БД нужны экспортеры.
# Выключенный в COMPOSE_PROFILES сервис отображается как таргет в состоянии
# down — это ожидаемо, а не ошибка.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: seaweedfs
    static_configs:
      - targets: ["seaweedfs:9327"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
