# Инфраструктурный стек: MongoDB, Redis, RabbitMQ, MinIO.
# Пароли и порты задаются в .env — см. .env.example и README.md.
name: services

services:
  # Одноразовый init: генерирует keyFile для внутренней аутентификации
  # replica set (обязателен, когда включена авторизация). Идемпотентен.
  # Одноразовому контейнеру healthcheck не нужен:
  # kics-scan ignore-block
  mongo-keyfile:
    image: mongo:8.0
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    entrypoint:
      - bash
      - -ec
      - |
        if [ ! -f /keyfile/mongo-keyfile ]; then
          openssl rand -base64 756 > /keyfile/mongo-keyfile
          chown mongodb:mongodb /keyfile/mongo-keyfile
          chmod 400 /keyfile/mongo-keyfile
        fi
    volumes:
      - mongo_keyfile:/keyfile
    networks: [backend]

  mongodb:
    image: mongo:8.0
    # стабильный hostname: он прописан в конфиге replica set (host: mongodb:27017)
    hostname: mongodb
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    command: ["--replSet", "rs0", "--keyFile", "/data/keyfile/mongo-keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?is not set, see .env.example}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?is not set, see .env.example}
    ports:
      - "${BIND_IP:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - mongo_keyfile:/data/keyfile:ro
    networks: [backend]
    # healthcheck заодно инициирует replica set при первом запуске;
    # READY (healthy) — только когда узел стал PRIMARY набора rs0
    healthcheck:
      test: >-
        mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --quiet
        --eval 'const h = db.hello(); if (h.isWritablePrimary && h.setName == "rs0") print("READY");
        else if (!h.setName) rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});'
        | grep -q READY
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?is not set, see .env.example}", "--appendonly", "yes"]
    environment:
      # redis-cli в healthcheck читает пароль отсюда — не нужен флаг -a
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    # RabbitMQ привязывает данные к имени узла (rabbit@<hostname>) —
    # фиксируем hostname, чтобы данные переживали пересоздание контейнера
    hostname: rabbitmq
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?is not set, see .env.example}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?is not set, see .env.example}
    ports:
      - "${BIND_IP:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${BIND_IP:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  minio:
    # Последний community-релиз с полноценной веб-консолью (пользователи,
    # политики, access keys). Новых community-образов не будет — проект
    # заархивирован, тег пинован намеренно. Подробности в README.md.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?is not set, see .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?is not set, see .env.example}
    ports:
      - "${BIND_IP:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?is not set, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?is not set, see .env.example}
    ports:
      - "${BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # с postgres 18 том монтируется в /var/lib/postgresql (не в .../data):
      # PGDATA лежит в версионном подкаталоге ради быстрого pg_upgrade --link
      - pg_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?is not set, see .env.example}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?is not set, see .env.example}
      # непривилегированный порт: бинд на 80 требует повышения привилегий,
      # которое запрещено no-new-privileges
      PGADMIN_LISTEN_PORT: 8080
    ports:
      - "${BIND_IP:-127.0.0.1}:${PGADMIN_PORT:-5050}:8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  backend:
    # фиксированное имя, чтобы приложения из других compose-проектов
    # могли подключиться: networks: { services_backend: { external: true } }
    name: services_backend

volumes:
  mongo_data:
  mongo_config:
  mongo_keyfile:
  redis_data:
  rabbitmq_data:
  minio_data:
  pg_data:
  pgadmin_data:
