# Инфраструктурный стек: MongoDB, Redis, RabbitMQ, SeaweedFS (S3), PostgreSQL,
# pgAdmin; опционально — MinIO.
# Пароли и порты задаются в .env — см. .env.example и README.md.
# Каждый сервис — в одноимённом профиле: состав стека выбирает COMPOSE_PROFILES
# в .env, сервис вне списка не поднимается. Применить изменение состава:
# bash deploy/apply-profiles.sh (см. README, «Отключение ненужных сервисов»).
name: services

services:
  # Одноразовый init: генерирует keyFile для внутренней аутентификации
  # replica set (обязателен, когда включена авторизация). Идемпотентен.
  # Одноразовому контейнеру healthcheck не нужен:
  # kics-scan ignore-block
  mongo-keyfile:
    image: mongo:8.0
    # зависимость mongodb — включается и выключается вместе с ним
    profiles: ["mongodb"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    entrypoint:
      - bash
      - -ec
      - |
        if [ ! -f /keyfile/mongo-keyfile ]; then
          openssl rand -base64 756 > /keyfile/mongo-keyfile
          chown mongodb:mongodb /keyfile/mongo-keyfile
          chmod 400 /keyfile/mongo-keyfile
        fi
    volumes:
      - mongo_keyfile:/keyfile
    networks: [backend]

  mongodb:
    image: mongo:8.0
    profiles: ["mongodb"]
    # стабильный hostname: он прописан в конфиге replica set (host: mongodb:27017)
    hostname: mongodb
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    command: ["--replSet", "rs0", "--keyFile", "/data/keyfile/mongo-keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?is not set, see .env.example}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?is not set, see .env.example}
    ports:
      - "${BIND_IP:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - mongo_keyfile:/data/keyfile:ro
    networks: [backend]
    # healthcheck заодно инициирует replica set при первом запуске;
    # READY (healthy) — только когда узел стал PRIMARY набора rs0
    healthcheck:
      test: >-
        mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --quiet
        --eval 'const h = db.hello(); if (h.isWritablePrimary && h.setName == "rs0") print("READY");
        else if (!h.setName) rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});'
        | grep -q READY
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?is not set, see .env.example}", "--appendonly", "yes"]
    environment:
      # redis-cli в healthcheck читает пароль отсюда — не нужен флаг -a
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    profiles: ["rabbitmq"]
    # RabbitMQ привязывает данные к имени узла (rabbit@<hostname>) —
    # фиксируем hostname, чтобы данные переживали пересоздание контейнера
    hostname: rabbitmq
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?is not set, see .env.example}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?is not set, see .env.example}
    ports:
      - "${BIND_IP:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${BIND_IP:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  seaweedfs:
    # Объектное S3-хранилище по умолчанию (см. README, «Объектное хранилище»).
    # Режим mini: master + volume + filer + S3 + веб-админка в одном процессе.
    image: chrislusf/seaweedfs:4.40
    profiles: ["seaweedfs"]
    # стабильный идентификатор узла вместо меняющегося IP контейнера
    hostname: seaweedfs
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -admin.user=${SEAWEEDFS_USER:?is not set, see .env.example}
      - -admin.password=${SEAWEEDFS_PASSWORD:?is not set, see .env.example}
      # prometheus-метрики (порт только внутри docker-сети)
      - -metricsPort=9327
    environment:
      # S3-креды: применяются при каждом старте (смена пароля = up -d seaweedfs)
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_USER}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_PASSWORD}
    ports:
      - "${BIND_IP:-127.0.0.1}:${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${BIND_IP:-127.0.0.1}:${SEAWEEDFS_ADMIN_PORT:-23646}:23646"
    volumes:
      - seaweedfs_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8333/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Одноразовый S3-клиент (rclone) для backup.sh/restore.sh и смоука:
  # стеком не поднимается (профиль tools), запускается через docker compose run.
  # Разовому контейнеру healthcheck не нужен:
  # kics-scan ignore-block
  s3-client:
    image: ghcr.io/rclone/rclone:1.75
    profiles: ["tools"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    environment:
      RCLONE_CONFIG: /dev/null
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: Other
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${SEAWEEDFS_USER}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${SEAWEEDFS_PASSWORD}
      RCLONE_CONFIG_S3_ENDPOINT: http://seaweedfs:8333
      RCLONE_CONFIG_S3_FORCE_PATH_STYLE: "true"
    networks: [backend]

  minio:
    # ОПЦИЯ (в COMPOSE_PROFILES по умолчанию не входит): последний community-релиз
    # MinIO с полноценной веб-консолью — для приложений, ещё не переехавших на
    # SeaweedFS. Новых community-образов не будет — проект заархивирован,
    # тег пинован намеренно. Подробности в README.md.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["minio"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?is not set, see .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?is not set, see .env.example}
    ports:
      - "${BIND_IP:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?is not set, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?is not set, see .env.example}
    ports:
      - "${BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # с postgres 18 том монтируется в /var/lib/postgresql (не в .../data):
      # PGDATA лежит в версионном подкаталоге ради быстрого pg_upgrade --link
      - pg_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:9
    # работает и без postgres в списке — умеет подключаться к внешним базам
    profiles: ["pgadmin"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?is not set, see .env.example}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?is not set, see .env.example}
      # непривилегированный порт: бинд на 80 требует повышения привилегий,
      # которое запрещено no-new-privileges
      PGADMIN_LISTEN_PORT: 8080
    ports:
      - "${BIND_IP:-127.0.0.1}:${PGADMIN_PORT:-5050}:8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- Мониторинг: профиль monitoring (в состав по умолчанию НЕ входит,
  # включается словом monitoring в COMPOSE_PROFILES — см. README). RabbitMQ
  # (15692) и SeaweedFS (9327) отдают метрики нативно, экспортеры не нужны.
  # Экспортер выключенной БД не падает — просто отдаёт up=0.
  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "${BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:13.1.1
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      # применяются при первой инициализации volume; дальше — через UI
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?is not set, see .env.example}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Метрики хоста. Смонтированный / — read-only, стандартная схема
  # node-exporter (--path.rootfs); наружу порт не публикуется. Маунт без
  # rslave: Docker Desktop не поддерживает propagation для /, а для метрик
  # CPU/RAM/диска она и не нужна.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command:
      - --path.rootfs=/host
    volumes:
      # kics-scan ignore-line
      - /:/host:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9100/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Метрики контейнеров. docker.sock и системные каталоги — read-only,
  # стандартная схема cAdvisor; наружу порт не публикуется. containerd.sock
  # обязателен: docker-фабрика cadvisor ходит через containerd, без него
  # метрики будут без имён контейнеров.
  cadvisor:
    # git-теги cadvisor уходят вперёд, образы публикуются выборочно —
    # пиновать только на реально существующий тег в gcr
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      # kics-scan ignore-line
      - /:/rootfs:ro
      # kics-scan ignore-line
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # kics-scan ignore-line
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      # kics-scan ignore-line
      - /sys:/sys:ro
      # kics-scan ignore-line
      - /var/lib/docker:/var/lib/docker:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0-alpine
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9121/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_USER}?sslmode=disable
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9187/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # В образе нет shell — healthcheck невозможен; живость видна по таргету
  # mongodb в Prometheus (up):
  # kics-scan ignore-block
  mongodb-exporter:
    image: percona/mongodb_exporter:0.52.0
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["--collect-all", "--compatible-mode"]
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?directConnection=true
    networks: [backend]

networks:
  backend:
    # фиксированное имя, чтобы приложения из других compose-проектов
    # могли подключиться: networks: { services_backend: { external: true } }
    name: services_backend

volumes:
  mongo_data:
  mongo_config:
  mongo_keyfile:
  redis_data:
  rabbitmq_data:
  seaweedfs_data:
  minio_data:
  pg_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
