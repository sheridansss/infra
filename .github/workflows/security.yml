# Сканирование безопасности: CVE в образах стека и поиск секретов в файлах
# репозитория. Кроме push/PR запускается еженедельно по расписанию: CVE появляются
# и без наших коммитов.
# Политика: CI валят только CRITICAL-находки с доступным фиксом (--ignore-unfixed) —
# HIGH показываются в логе, но не блокируют: в официальных образах они часто
# неустранимы с нашей стороны (уязвимости в вшитых бинарниках вроде gosu, которые
# апстрим пересобирает месяцами). MinIO пинован на EOL-образ сознательно
# (см. README) — его отчёт целиком информационный.
# Misconfig-скан — KICS (trivy docker-compose не поддерживает): проверки
# compose-файла и workflows, гейт по HIGH/MEDIUM, осознанные исключения — ниже.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # понедельник 03:17 UTC
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Сгенерировать .env (нужен для docker compose config)
        run: bash generate-env.sh

      - name: CVE-скан образов (гейт — CRITICAL; HIGH и MinIO — информационно)
        run: |
          FAILED=0
          for IMG in $(docker compose config --images | sort -u); do
            case "$IMG" in
              minio/minio:*)
                echo "::group::$IMG — EOL, пинован сознательно, отчёт информационный"
                trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$IMG"
                echo "::endgroup::"
                ;;
              *)
                echo "::group::$IMG"
                trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$IMG"
                # гейт отдельным быстрым проходом (БД и слои уже в кеше)
                trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet "$IMG" \
                  || { FAILED=1; echo "::error::CRITICAL с доступным фиксом в $IMG — детали в логе выше"; }
                echo "::endgroup::"
                ;;
            esac
          done
          exit "$FAILED"

  misconfig:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Исключённые проверки (обоснование):
      #   487f4be7 (Passwords And Secrets) — FP на compose-интерполяции ${VAR:?...};
      #     настоящие секреты ищет джоб secrets (trivy)
      #   ce76b7d0 (Container Capabilities) — cap_drop под entrypoint'ы чужих
      #     официальных образов хрупок при их обновлениях; принято
      - name: KICS misconfig-скан (docker-compose, workflows)
        uses: checkmarx/kics-github-action@05aa5eb70eede1355220f4ca5238d96b397e30a6 # v2.1.20
        with:
          path: .
          fail_on: high,medium
          exclude_paths: backup,.git
          exclude_queries: 487f4be7-3fd9-4506-a07a-eae252180c08,ce76b7d0-9e77-464d-b86f-c5c48e03e22d

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Скан секретов в файлах репозитория
        run: trivy fs --scanners secret --exit-code 1 .
