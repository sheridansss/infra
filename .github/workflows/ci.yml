# CI: линтеры скриптов + подъём всего стека на раннере и смоук-тест каждого сервиса.
# Секретов не требует: .env генерируется на раннере нашим же generate-env.sh.
name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck generate-env.sh backup.sh backup-cold.sh backup-sync.sh restore.sh deploy/*.sh

      - name: PSScriptAnalyzer generate-env.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path ./generate-env.ps1 -Severity Warning, Error
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host }
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Сгенерировать .env
        run: |
          bash generate-env.sh
          # CI тестирует всё, включая опциональные minio и monitoring
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=mongodb,redis,rabbitmq,seaweedfs,minio,postgres,pgadmin,monitoring/' .env

      - name: Валидация compose-файла
        run: docker compose config --quiet

      - name: Поднять стек и дождаться healthy
        run: docker compose up -d --wait --quiet-pull

      - name: Смоук-тесты всех сервисов
        run: |
          set -a; source .env; set +a

          docker compose exec -T mongodb mongosh -u "$MONGO_ROOT_USER" -p "$MONGO_ROOT_PASSWORD" \
            --authenticationDatabase admin --quiet --eval '
              const st = rs.status();
              if (st.members[0].stateStr != "PRIMARY") throw new Error("mongo is not PRIMARY");
              const s = db.getMongo().startSession();
              const col = s.getDatabase("smoke").t;
              s.startTransaction(); col.insertOne({ok: 1}); s.commitTransaction();
              db.getSiblingDB("smoke").dropDatabase();
              print("mongo: replica set + transaction OK");
            '

          docker compose exec -T redis sh -c 'redis-cli set smoke 42 | grep OK && redis-cli get smoke | grep 42 && redis-cli del smoke > /dev/null'
          echo "redis: OK"

          curl -fsS -u "$RABBITMQ_USER:$RABBITMQ_PASSWORD" "http://127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}/api/overview" | grep -o '"rabbitmq_version"'
          echo "rabbitmq: OK"

          curl -fsS "http://127.0.0.1:${MINIO_API_PORT}/minio/health/live"
          docker compose exec -T minio sh -c "mc alias set local http://localhost:9000 '$MINIO_ROOT_USER' '$MINIO_ROOT_PASSWORD' > /dev/null && mc mb local/smoke && mc rb local/smoke"
          echo "minio: OK"

          curl -fsS "http://127.0.0.1:${SEAWEEDFS_S3_PORT}/status" > /dev/null
          # админка отвечает редиректом на /login — нужен -L
          curl -fsSL "http://127.0.0.1:${SEAWEEDFS_ADMIN_PORT}/" | grep -qi seaweedfs
          docker compose --profile tools run --rm -T s3-client mkdir s3:smoke
          docker compose --profile tools run --rm -T s3-client rmdir s3:smoke
          echo "seaweedfs: OK"

          docker compose exec -T postgres psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/$POSTGRES_USER" \
            -v ON_ERROR_STOP=1 -c 'CREATE TABLE smoke(id int); INSERT INTO smoke VALUES (1); DROP TABLE smoke;' > /dev/null
          echo "postgres: OK"

          curl -fsS "http://127.0.0.1:${PGADMIN_PORT}/misc/ping" | grep PING
          echo "pgadmin: OK"

          curl -fsS "http://127.0.0.1:${GRAFANA_PORT}/api/health" | jq -e '.database == "ok"' > /dev/null
          # дашборд «Обзор стека» доехал через provisioning
          curl -fsS -u "$GRAFANA_USER:$GRAFANA_PASSWORD" \
            "http://127.0.0.1:${GRAFANA_PORT}/api/search?type=dash-db" | jq -e 'length >= 1' > /dev/null
          # все таргеты prometheus должны перейти в up (экспортерам нужно
          # несколько скрейп-циклов)
          for _ in $(seq 1 24); do
            DOWN=$(curl -fsS "http://127.0.0.1:${PROMETHEUS_PORT}/api/v1/targets" \
              | jq -r '.data.activeTargets[] | select(.health != "up") | .labels.job' | xargs)
            if [ -z "$DOWN" ]; then break; fi
            sleep 5
          done
          if [ -n "$DOWN" ]; then echo "таргеты не в up: $DOWN"; exit 1; fi
          UP=$(curl -fsS "http://127.0.0.1:${PROMETHEUS_PORT}/api/v1/targets" \
            | jq '[.data.activeTargets[] | select(.health == "up")] | length')
          test "$UP" -eq 8
          echo "monitoring: OK ($UP таргетов up)"

      - name: Цикл аварии — бэкап, потеря данных, restore.sh
        run: |
          # маркерные данные в каждом сервисе
          docker compose exec -T mongodb sh -c 'mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "db.getSiblingDB(\"drtest\").t.insertOne({probe: 777})"' > /dev/null
          docker compose exec -T postgres sh -c 'psql -q -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE drtest" && psql -q -U "$POSTGRES_USER" -d drtest -c "CREATE TABLE probe(v int); INSERT INTO probe VALUES (777)"'
          docker compose exec -T redis redis-cli set dr:probe 777 > /dev/null
          docker compose exec -T rabbitmq rabbitmqctl -q add_user dr_probe secret777
          docker compose exec -T minio sh -c 'mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" > /dev/null && mc mb -p local/drtest > /dev/null && echo probe-777 | mc pipe local/drtest/probe.txt > /dev/null'
          docker compose --profile tools run --rm -T s3-client mkdir s3:drtest
          echo probe-777 | docker compose --profile tools run --rm -T s3-client rcat s3:drtest/probe.txt

          bash backup.sh
          LATEST=$(printf '%s\n' backup/????-??-??_?????? | tail -n 1)
          for f in mongodb.archive.gz postgres.sql.gz redis.rdb rabbitmq-definitions.json seaweedfs.tar.gz minio.tar.gz manifest.txt; do
            [ -s "$LATEST/$f" ] || { echo "отсутствует или пуст: $LATEST/$f"; exit 1; }
          done

          # "авария": уничтожаем маркеры
          docker compose exec -T mongodb sh -c 'mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "db.getSiblingDB(\"drtest\").dropDatabase()"' > /dev/null
          docker compose exec -T postgres sh -c 'psql -q -U "$POSTGRES_USER" -d postgres -c "DROP DATABASE drtest"'
          docker compose exec -T redis redis-cli del dr:probe > /dev/null
          docker compose exec -T rabbitmq rabbitmqctl -q delete_user dr_probe
          docker compose exec -T minio sh -c 'mc rb --force local/drtest' > /dev/null
          docker compose --profile tools run --rm -T s3-client purge s3:drtest

          bash restore.sh latest --yes

          # всё должно вернуться
          docker compose exec -T mongodb sh -c 'mongosh -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "const v = db.getSiblingDB(\"drtest\").t.findOne().probe; if (v != 777) throw new Error(\"mongo: \" + v)"'
          docker compose exec -T postgres sh -c 'psql -t -A -U "$POSTGRES_USER" -d drtest -c "SELECT v FROM probe"' | grep -qx 777
          docker compose exec -T redis redis-cli get dr:probe | grep -q 777
          docker compose exec -T rabbitmq rabbitmqctl -q list_users | grep -q dr_probe
          docker compose exec -T minio sh -c 'mc cat local/drtest/probe.txt' | grep -q probe-777
          docker compose --profile tools run --rm -T s3-client cat s3:drtest/probe.txt | grep -q probe-777
          echo "DR-цикл пройден: все маркеры восстановлены"

      - name: Выгрузка наружу (backup-sync.sh, оба режима)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y rclone

          # без BACKUP_REMOTE — тихий пропуск
          bash backup-sync.sh | grep -q "не настроена"

          # режим rsync (локальный путь) и режим rclone (on-the-fly local-remote)
          BACKUP_REMOTE=/tmp/offsite-rsync bash backup-sync.sh
          diff -r backup /tmp/offsite-rsync
          BACKUP_REMOTE=":local:/tmp/offsite-rclone" bash backup-sync.sh
          diff -r backup /tmp/offsite-rclone

          # ротация доезжает до зеркала: удалённый локально каталог исчезает и там
          rm -rf backup/????-??-??_??????
          mkdir -p backup/2099-01-01_000000 && echo x > backup/2099-01-01_000000/manifest.txt
          BACKUP_REMOTE=/tmp/offsite-rsync bash backup-sync.sh
          diff -r backup /tmp/offsite-rsync

          # страховка: пустой локальный backup/ не затирает внешнюю копию
          rm -rf backup/*
          if BACKUP_REMOTE=/tmp/offsite-rsync bash backup-sync.sh; then
            echo "страховка от пустого backup/ не сработала"; exit 1
          fi
          test -n "$(ls /tmp/offsite-rsync)"

      - name: Профили — частичный состав стека и страховка автодеплоя
        run: |
          # с одним профилем в списке активен ровно один сервис
          test "$(COMPOSE_PROFILES=redis docker compose config --services)" = "redis"

          # страховка автодеплоя: старый .env (без COMPOSE_PROFILES, SEAWEEDFS_*,
          # GRAFANA_*) получает прежний состав сервисов и недостающие креды.
          # Пароли возвращаем, чтобы .env остался согласован с уже запущенными
          # контейнерами.
          PW=$(sed -n 's/^SEAWEEDFS_PASSWORD=//p' .env)
          GPW=$(sed -n 's/^GRAFANA_PASSWORD=//p' .env)
          sed -i '/^COMPOSE_PROFILES=/d; /^SEAWEEDFS_USER=/d; /^SEAWEEDFS_PASSWORD=/d; /^GRAFANA_USER=/d; /^GRAFANA_PASSWORD=/d' .env
          bash deploy/ensure-env.sh
          grep -q '^COMPOSE_PROFILES=mongodb,redis,rabbitmq,minio,postgres,pgadmin$' .env
          grep -q '^SEAWEEDFS_PASSWORD=..*' .env
          grep -q '^GRAFANA_PASSWORD=..*' .env
          sed -i "s/^SEAWEEDFS_PASSWORD=.*/SEAWEEDFS_PASSWORD=$PW/" .env
          sed -i "s/^GRAFANA_PASSWORD=.*/GRAFANA_PASSWORD=$GPW/" .env
          test "$(docker compose config --services | sort | xargs)" = "minio mongo-keyfile mongodb pgadmin postgres rabbitmq redis"

          # реальное выключение: оставляем redis и postgres, apply-profiles
          # должен остановить и удалить остальные контейнеры (volumes остаются)
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=redis,postgres/' .env
          bash deploy/apply-profiles.sh
          test "$(docker compose ps -a --services | sort | xargs)" = "postgres redis"
          docker volume inspect services_minio_data > /dev/null

          # бэкап и restore работают только с включённым набором
          bash backup.sh
          LATEST=$(printf '%s\n' backup/????-??-??_?????? | tail -n 1)
          test -s "$LATEST/redis.rdb"
          test -s "$LATEST/postgres.sql.gz"
          test ! -e "$LATEST/minio.tar.gz"
          grep -q '^services: postgres redis$' "$LATEST/manifest.txt"
          bash restore.sh latest --yes
          if bash restore.sh latest --yes minio; then
            echo "restore.sh должен отказываться восстанавливать выключенный сервис"; exit 1
          fi

          # вернуть полный состав — выключение обратимо
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=mongodb,redis,rabbitmq,seaweedfs,minio,postgres,pgadmin,monitoring/' .env
          bash deploy/apply-profiles.sh
          docker compose ps --services | grep -qx minio
          docker compose ps --services | grep -qx seaweedfs
          docker compose ps --services | grep -qx prometheus
          echo "профили: частичный состав, страховка и возврат — OK"

      - name: Диагностика при падении
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100
